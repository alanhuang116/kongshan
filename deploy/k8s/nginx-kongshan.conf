# 安乐窝（kongshan）静态站：容器内 nginx 监听 80，只做静态文件
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 先载入标准 MIME 表，再补 webmanifest（server 级 types 会覆盖继承表，必须 include）
    include /etc/nginx/mime.types;
    types {
        application/manifest+json webmanifest;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/javascript application/json application/manifest+json text/css text/plain image/svg+xml;

    # 带哈希的资源长缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Service Worker 与入口不吃缓存
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    # 单页应用回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
