<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>空山 · 声音试听台</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; background: #0d0e0f; color: #dcdad4; font: 14px/1.6 "Noto Serif SC", "Songti SC", serif; }
      main { max-width: 1180px; margin: 0 auto; padding: 22px 18px 60px; }
      h1 { font-size: 20px; font-weight: 500; letter-spacing: 0.3em; margin: 0 0 4px; }
      h2 { font-size: 13px; font-weight: 500; letter-spacing: 0.25em; color: #b9a67f; margin: 26px 0 10px; border-top: 1px solid #26282a; padding-top: 14px; }
      p.note { color: #8d8b85; margin: 0 0 8px; font-size: 12.5px; }
      button { font: inherit; color: #dcdad4; background: #1a1c1e; border: 1px solid #303335; border-radius: 6px; padding: 5px 11px; cursor: pointer; }
      button:hover { border-color: #b9a67f; }
      button.gold { background: #b9a67f; color: #16130c; border-color: #b9a67f; }
      .grid { display: flex; flex-wrap: wrap; gap: 6px; }
      .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 5px 0; }
      .row label { min-width: 74px; color: #a9a7a0; }
      .row output { min-width: 42px; color: #8d8b85; font-variant-numeric: tabular-nums; }
      input[type=range] { width: 200px; accent-color: #b9a67f; }
      select { font: inherit; background: #1a1c1e; color: #dcdad4; border: 1px solid #303335; border-radius: 6px; padding: 4px 8px; }
      canvas { display: block; width: 100%; max-width: 1140px; height: auto; background: #000; border: 1px solid #26282a; border-radius: 4px; margin-top: 8px; }
      pre { background: #131415; border: 1px solid #26282a; border-radius: 4px; padding: 10px 12px; font: 12px/1.5 ui-monospace, Consolas, monospace; white-space: pre-wrap; color: #a9a7a0; max-height: 260px; overflow: auto; }
      .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0 36px; }
      @media (max-width: 820px) { .cols { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main id="lab"></main>
    <script type="module" src="/src/lab/audio-lab.ts"></script>
  </body>
</html>
